backend:
  name: github
  repo: mourtadade44-lab/my-book-library
  branch: main

# Default folder for uploaded media
media_folder: "books"
public_folder: "books"

collections:
  - name: "library_data"
    label: "Library Content"
    files:
      - label: "Books Collection"
        name: "books"
        file: "books.yaml"
        fields:
          - label: "Books"
            name: "books"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Author", name: "author", widget: "string" }
              - { label: "Category", name: "category", widget: "string" }
              - { label: "Language", name: "language", widget: "select", options: ["Arabic", "French", "English"], required: false }
              - { label: "Description", name: "description", widget: "text", required: false }
              - { label: "Book PDF File", name: "file", widget: "file", media_folder: "books", public_folder: "books" }
              - { label: "Thumbnail / Cover Image", name: "thumbnail", widget: "image", media_folder: "thumbnails", public_folder: "thumbnails", required: false }

      - label: "Articles Collection"
        name: "articles"
        file: "articles.yaml"
        fields:
          - label: "Articles"
            name: "articles"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Author", name: "author", widget: "string" }
              - { label: "Category", name: "category", widget: "string", required: false }
              - { label: "Description", name: "description", widget: "text", required: false }
              - { label: "Article File (.txt)", name: "file", widget: "file", media_folder: "essay", public_folder: "essay" }
